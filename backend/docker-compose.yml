services:
  postgres:
    image: postgres:16
    container_name: auth-service-postgres
    restart: always
    environment:
      POSTGRES_USER: authservice
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: authservice_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: auth-service-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
